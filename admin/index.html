<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin | Chaudhari Manufacturing</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body class="admin-body">
  <main id="adminRoot"></main>
  <div id="toastRegion" class="toast-region" aria-live="polite"></div>
  <dialog id="confirmDialog" class="dialog">
    <form method="dialog">
      <button class="dialog-close" aria-label="Close">×</button>
      <p class="eyebrow">PLEASE CONFIRM</p>
      <h2 id="confirmTitle">Confirm action</h2>
      <p id="confirmMessage"></p>
      <div class="dialog-actions">
        <button class="button button-quiet" value="cancel">Cancel</button>
        <button id="confirmSubmit" class="button button-danger" value="confirm">Delete</button>
      </div>
    </form>
  </dialog>
  <script src="/js/config.js"></script>
  <script src="/admin/admin.js"></script>
</body>
</html>
